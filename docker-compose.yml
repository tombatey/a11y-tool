services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: a11y_tool
      POSTGRES_USER: a11y_user
      POSTGRES_PASSWORD: a11y_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a11y_user -d a11y_tool"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://a11y_user:a11y_pass@db:5432/a11y_tool
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  app_data:
