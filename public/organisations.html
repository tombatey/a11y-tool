<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Organisations — A11y Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
  --blue-900: #014357; --blue-800: #017CA1; --blue-700: #02A2D3;
  --blue-600: #02BFF8; --blue-100: #E1F7FE;
  --green-900: #354C0F; --green-800: #547717; --green-700: #82B824;
  --green-600: #98D62C; --green-100: #F3FAE6;
  --slate-900: #0F172A; --slate-700: #334155; --slate-500: #64748B;
  --slate-200: #E2E8F0; --slate-50: #F8FAFC;
  --ink:   #014357; --body: #334155; --paper: #F8FAFC;
  --line:  #E2E8F0; --muted: #64748B; --accent: #017CA1;
  --critical: #8c2f2f; --serious: #b5611c; --moderate: #8a7a1e; --minor: #5b6470;
}
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--paper); color: var(--ink); }
  header { padding: 32px 32px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-link { font-size: 13px; color: var(--muted); text-decoration: none; }
  .header-link:hover { color: var(--ink); }
  .header-user { font-size: 12px; color: var(--muted); }
  .logout-btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; font-size: 12px; color: var(--muted); font-family: inherit; }
  .logout-btn:hover { border-color: var(--ink); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 32px 32px 80px; }
  footer.app-footer {
    max-width: 640px; margin: 0 auto; padding: 16px 32px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    font-size: 11px; color: var(--muted);
  }
  footer.app-footer a { color: var(--muted); text-decoration: none; }
  footer.app-footer a:hover { color: var(--ink); text-decoration: underline; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 24px; }
  .panel h2 { margin: 0 0 16px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--paper); }
  .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  button.primary { margin-top: 16px; padding: 10px 18px; background: #02BFF8; color: #014357; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.15s; }
  button.primary:hover { background: #02A2D3; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .remove-btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; font-size: 11px; color: var(--muted); }
  .remove-btn:hover { border-color: var(--critical); color: var(--critical); }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 0; }
  .tm-org-id { font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, monospace; }
  .msg { margin-top: 12px; font-size: 12px; padding: 8px 12px; border-radius: 6px; }
  .msg.ok  { background: #F3FAE6; color: #547717; }
  .msg.err { background: #fdf2f2; color: var(--critical); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Organisations</h1>
    <p>Link a Testing Manager organisation so scans can raise bugs into it</p>
  </div>
  <div class="header-right">
    <a href="/" class="header-link">Scanner</a>
    <a href="/history.html" class="header-link">History</a>
    <a href="/team.html" class="header-link">Team</a>
    <span id="headerUser" class="header-user"></span>
    <form action="/auth/logout" method="post" style="margin:0">
      <button class="logout-btn" type="submit">Sign out</button>
    </form>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Add organisation</h2>
    <label for="addName">Name</label>
    <input type="text" id="addName" placeholder="e.g. Acme Ltd" />
    <label for="addTmOrgId">Testing Manager organisation ID</label>
    <input type="text" id="addTmOrgId" placeholder="Bubble unique_id" />
    <div class="field-hint">Found on the organisation's record in Testing Manager.</div>
    <button class="primary" id="addBtn" onclick="addOrganisation()">Add organisation</button>
    <div id="addMsg" style="display:none" class="msg"></div>
  </section>

  <section class="panel">
    <h2>Linked organisations</h2>
    <div id="orgList"><div class="empty">Loading…</div></div>
  </section>
</main>

<script>
fetch('/api/me')
  .then(r => { if (r.status === 401) window.location.href = '/login'; return r.json(); })
  .then(user => {
    document.getElementById('headerUser').textContent = user.name || user.email;
    loadOrganisations();
  });

async function loadOrganisations() {
  const res  = await fetch('/api/organisations');
  const orgs = await res.json();
  const el   = document.getElementById('orgList');
  if (!orgs.length) { el.innerHTML = '<div class="empty">No organisations linked yet.</div>'; return; }

  const rows = orgs.map(o => `<tr>
      <td>
        ${escHtml(o.name)}
        <div class="tm-org-id">${escHtml(o.tm_org_id)}</div>
      </td>
      <td style="text-align:right">
        <button class="remove-btn" onclick="removeOrganisation(${o.id}, '${escHtml(o.name)}')">Remove</button>
      </td>
    </tr>`).join('');

  el.innerHTML = `<table><thead><tr><th>Name / Testing Manager ID</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function addOrganisation() {
  const name     = document.getElementById('addName').value.trim();
  const tmOrgId  = document.getElementById('addTmOrgId').value.trim();
  const msg      = document.getElementById('addMsg');
  if (!name)    { showMsg(msg, 'Name is required.', 'err'); return; }
  if (!tmOrgId) { showMsg(msg, 'Testing Manager organisation ID is required.', 'err'); return; }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;

  const res = await fetch('/api/organisations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, tm_org_id: tmOrgId }),
  });

  btn.disabled = false;

  if (res.ok) {
    document.getElementById('addName').value    = '';
    document.getElementById('addTmOrgId').value = '';
    showMsg(msg, `${name} added successfully.`, 'ok');
    loadOrganisations();
  } else {
    const err = await res.json().catch(() => ({}));
    showMsg(msg, err.error || 'Failed to add organisation.', 'err');
  }
}

async function removeOrganisation(id, name) {
  if (!confirm(`Remove ${name}? Scans already linked to it will keep their existing data.`)) return;
  await fetch(`/api/organisations/${id}`, { method: 'DELETE' });
  loadOrganisations();
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = `msg ${type}`;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
<footer class="app-footer">
  <span>A <a href="https://www.webdepend.dev/" target="_blank" rel="noopener noreferrer">WebDepend Labs</a> tool</span>
  <a id="versionLink" href="/changelog">v…</a>
  <span>© 2026 WebDepend Ltd.</span>
</footer>
<script src="version-footer.js"></script>
</body>
</html>
