<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in — A11y Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
  --ink: #014357; --body: #334155; --paper: #F8FAFC; --line: #E2E8F0; --accent: #017CA1;
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #E1F7FE;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .wordmark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #017CA1;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 11px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .google-btn:hover {
    border-color: #02BFF8;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .google-logo { flex-shrink: 0; }
  .error {
    margin-top: 20px;
    padding: 10px 14px;
    background: #fdf2f2;
    border: 1px solid #f5c6c6;
    border-radius: 6px;
    font-size: 12px;
    color: #8c2f2f;
  }
  .footer {
    margin-top: 32px;
    font-size: 11px;
    color: var(--muted);
  }
  footer.app-footer {
    width: 100%;
    max-width: 480px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
    color: var(--muted, #64748B);
  }
  footer.app-footer a { color: var(--muted, #64748B); text-decoration: none; }
  footer.app-footer a:hover { color: var(--ink); text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">WebDepend</div>
  <h1 style="color:#014357">Accessibility Scanner</h1>
  <p class="subtitle">Sign in with your WebDepend Google account to continue.</p>

  <a class="google-btn" href="/auth/google">
    <svg class="google-logo" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </a>

  <div id="errorMsg" class="error" style="display:none"></div>

  <div class="footer">Access is restricted to WebDepend team members.</div>
</div>

<footer class="app-footer">
  <span>A <a href="https://www.webdepend.dev/">WebDepend Labs</a> tool</span>
  <a id="versionLink" href="/changelog">v…</a>
  <span>© 2026 WebDepend Ltd.</span>
</footer>
<script src="version-footer.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('error') === 'unauthorised') {
    const el = document.getElementById('errorMsg');
    el.textContent = 'Your Google account is not authorised to access this tool. Contact your administrator.';
    el.style.display = 'block';
  }
</script>
</body>
</html>
